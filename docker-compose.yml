version: "3.8"

services:
  # ─────────────────────────────────────────────────
  # Flask web server — main karaoke engine
  # ─────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - ${SONGS_PATH:?SONGS_PATH is required}:/songs
      - pikaraoke-tmp:/tmp/pikaraoke
    environment:
      - DOCKER_MODE=true
      - DOWNLOAD_PATH=/songs/
      - VLC_SERVICE_URL=http://vlc:5010
      - SPLASH_SERVICE_URL=http://splash:5004
      - DOWNLOAD_SERVICE_URL=http://download:5003
    depends_on:
      vlc:
        condition: service_healthy
      download:
        condition: service_healthy
    networks:
      - pikaraoke
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  # VLC player + ffmpeg pitch shift
  # ─────────────────────────────────────────────────
  vlc:
    build:
      context: .
      dockerfile: docker/vlc/Dockerfile
    volumes:
      - ${SONGS_PATH:?SONGS_PATH is required}:/songs:ro
      - pikaraoke-tmp:/tmp/pikaraoke
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - VLC_PORT=5002
      - SERVICE_PORT=5010
      - PULSE_SERVER=unix:/run/user/${HOST_UID:-1000}/pulse/native
    devices:
      - /dev/snd:/dev/snd
      - /dev/dri:/dev/dri
    networks:
      - pikaraoke
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  # Pygame splash screen on TV
  # ─────────────────────────────────────────────────
  splash:
    build:
      context: .
      dockerfile: docker/splash/Dockerfile
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - SERVICE_PORT=5004
      - QR_URL=${QR_URL:-http://myvikaraoke.local}
      - HIDE_IP=${HIDE_IP:-false}
    devices:
      - /dev/dri:/dev/dri
    networks:
      - pikaraoke
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  # yt-dlp download service
  # ─────────────────────────────────────────────────
  download:
    build:
      context: .
      dockerfile: docker/download/Dockerfile
    volumes:
      - ${SONGS_PATH:?SONGS_PATH is required}:/songs
    environment:
      - DOWNLOAD_PATH=/songs/
      - SERVICE_PORT=5003
      - HIGH_QUALITY=${HIGH_QUALITY:-true}
    networks:
      - pikaraoke
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  # WebSocket bridge (modern UI)
  # ─────────────────────────────────────────────────
  ws:
    build:
      context: .
      dockerfile: docker/ws/Dockerfile
    ports:
      - "${WS_PORT:-80}:80"
    volumes:
      - ${SONGS_PATH:?SONGS_PATH is required}:/songs:ro
    environment:
      - PIKARAOKE_URL=http://web:5000
      - DOWNLOAD_PATH=/songs/
      - DB_PATH=/songs/karaoke.db
      - PORT=80
    depends_on:
      web:
        condition: service_healthy
    networks:
      - pikaraoke
    restart: unless-stopped

volumes:
  pikaraoke-tmp:

networks:
  pikaraoke:
    driver: bridge
